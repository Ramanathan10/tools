 entirely on variant perception. Your objective is to find what the market may be misunderstanding, ignoring, or","note":"","keywords":["analyst","analyze","consensus","entirely","find","focus","fund","hedge"],"val":2.5},{"id":"1025277262","type":"highlight","label":"If I had 6 months to become an Agentic AI Engineer. I'd do this. Stage 1: Python + Async ...","title":"Tweets From Suraj Sharma","author":"@suraj_sharma14 on Twitter","category":"tweets","url":"https://x.com/suraj_sharma14/status/2066128527989113123","text":"If I had 6 months to become an Agentic AI Engineer.\n\nI'd do this.\n\nStage 1: Python + Async Foundations\nasyncio, FastAPI, event-driven architecture, error handling, API integration patterns.\n\nStage 2: LLM Fundamentals for Agents\nContext management, model routing, token economics,","note":"","keywords":["stage","agentic","agents","architecture","async","asyncio","become","context"],"val":2.5},{"id":"1025133421","type":"highlight","label":"![](https://www.milanjovanovic.tech/blog-covers/mnw_158.png?imwidth=3840)","title":"Building Semantic Search With Amazon S3 Vectors and Semantic Kernel","author":"Milan Jovanović","category":"articles","url":"https://read.readwise.io/read/01kv2jn46xy90gm8679sqarp0z","text":"![](https://www.milanjovanovic.tech/blog-covers/mnw_158.png?imwidth=3840)","note":"","keywords":["blog-covers","https","imwidth","milanjovanovic","tech"],"val":2.5},{"id":"1025133335","type":"highlight","label":"• **At the start of your day**: Run `/chronicle standup last 3 days` to generate a summar...","title":"About GitHub Copilot CLI Session Data - GitHub Docs","author":"GitHub Docs","category":"articles","url":"https://read.readwise.io/read/01kv2jhsqb2cr5hmrhtck9642z","text":"•   **At the start of your day**: Run `/chronicle standup last 3 days` to generate a summary of recent work instead of reconstructing it manually.\n•   **Periodically, to level up**: Run `/chronicle tips` every week or two to discover features and workflow improvements you might be missing.\n•   **When Copilot keeps making the same mistake**: Run `/chronicle improve` to identify the pattern and generate custom instructions that make the agent more effective for your project.\n•   **To understand your token usage**: Run `/chronicle cost tips` to see where tokens are going and get suggestions for reducing costs.\n•   **To search for a specific topic**: Run `/chronicle search KEYWORD` to find sessions containing a specific term or topic. Unlike free-form questions, this searches session content directly for keywords rather than interpreting your query semantically.","note":"","keywords":["chronicle","generate","search","specific","tips","topic","agent","containing"],"val":2.5},{"id":"1024572282","type":"highlight","label":"**Vendors:** • **[Factory Router](https://substack.com/redirect/da83078c-d992-4b26-84b4-4...","title":"The Pulse: Did Anthropic’s New Model Just Boost Rival Codex’s Market Share?","author":"The Pragmatic Engineer","category":"articles","url":"https://read.readwise.io/read/01ktxbw68vmyhxpwyy5hd8xa7t","text":"**Vendors:**\n\n•   **[Factory Router](https://substack.com/redirect/da83078c-d992-4b26-84b4-4523e2d21846?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)**: automatically selecting the right model per session, claiming 20-25% cost savings. [More details](https://substack.com/redirect/da83078c-d992-4b26-84b4-4523e2d21846?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o).\n•   **[Not Diamond](https://substack.com/redirect/fe5ce8ff-3cb9-4bf7-8d9c-97c6af3532e1?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)**: auto-selection of coding models, claiming around 30% cost savings. Used by OpenRouter, under the hood. [More details](https://substack.com/redirect/cb0a70ce-b0a8-4d07-8318-20548f99ba2d?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o).\n•   **[Prism](https://substack.com/redirect/0c04842e-7312-4573-a488-258b0f30c643?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)** by Augment Code. Choosing the “best” model automatically for coding tasks. [More details](https://substack.com/redirect/0c04842e-7312-4573-a488-258b0f30c643?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o).\n•   **[Model Router](https://substack.com/redirect/01010fee-eeeb-49b9-9841-fe65e606091a?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)** by Morph. An API to suggest model selection for a prompt, based on a list of models. [More details](https://substack.com/redirect/01010fee-eeeb-49b9-9841-fe65e606091a?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)\n\n**AI gateways with routing built in.** API gateways are popular ways to use LLMs in workplaces.\n\n•   **[OpenRouter](https://substack.com/redirect/0801202c-20fd-4a00-940b-df6baab28628?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)**: comes with “auto router” functionality where, after analyzing the prompt, the best one is selected. Uses Not Diamond under the hood.[More details](https://substack.com/redirect/738a11e9-b3da-472c-baa4-2347892f84a5?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)\n•   **[Kilo Gateway](https://substack.com/redirect/ab8e0584-ea5d-43a8-bd85-90f6e89a98c0?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)**: route requests the model considered the best price-per-value. Supports using your own model keys, and using the service only as a router. [More details](https://substack.com/redirect/ab8e0584-ea5d-43a8-bd85-90f6e89a98c0?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)\n•   **[Requestly.ai](https://substack.com/redirect/7ab25e37-709b-4683-b964-60710de48619?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)**: automatically route requests to the right model based on cost, latency, and availability, and tons of configuration. [More details](https://substack.com/redirect/f5ca76cc-5ade-44ac-8657-6d17bea1d246?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)\n•   **[LiteLLM](https://substack.com/redirect/bb048754-7802-464a-81f3-57761376cd88?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)**: define routing rules that automatically select the best model, based on input content with the “auto routing” functionality. The setup is more manual, but you get more control than with many other AI gateways. [More details](https://substack.com/redirect/2ab748db-1919-42e8-9bff-bd8e019bfc1b?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)\n•   **[Envoy AI Gateway](https://substack.com/redirect/7f1ecc1d-48f2-43d5-badc-1658af1ab931?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)**: an open source gateway that offers *some* routing configuration, though it feels that the routing engine focuses more on availability, not cost optimization and smart model routing. [More details](https://substack.com/redirect/169ef9bb-8831-4750-84e3-88397c93e9f0?j=eyJ1IjoiMnU0NmNvIn0.KtBPFszAxps_4PDtPR9IiGT9N3Hf5Gjn0jMR_s1O80o)","note":"","keywords":["eyj1ijoimnu0nmnvin0","https","ktbpfszaxps","pdtpr9iigt9n3hf5gjn0jmr","redirect","s1o80o","substack","details"],"val":2.5},{"id":"1024572276","type":"highlight","label":"intelligent’ router that picks the right model for the right task","title":"The Pulse: Did Anthropic’s New Model Just Boost Rival Codex’s Market Share?","author":"The Pragmatic Engineer","category":"articles","url":"https://read.readwise.io/read/01ktxbvywedms8y5d908ke7zn8","text":"intelligent’ router that picks the right model for the right task","note":"","keywords":["right","intelligent","model","picks","router","task"],"val":2.5},{"id":"1024515031","type":"highlight","label":"I've been a backend Engineer for 12+ years. Today, I'm a Principal Engineer at Atlassian....","title":"Tweets From Puneet Patwari","author":"@system_monarch on Twitter","category":"tweets","url":"https://x.com/system_monarch/status/2064978857263014366","text":"I've been a backend Engineer for 12+ years. Today, I'm a Principal Engineer at Atlassian. \n\nI've designed systems that handle millions of requests. Sat on both sides of system design interviews.\n\nReviewed more architecture docs than I can count.\n\nStarting today, I'm breaking down","note":"","keywords":["engineer","today","architecture","atlassian","backend","breaking","count","design"],"val":2.5},{"id":"1024248032","type":"highlight","label":"Fucking insaneeee https://t.co/XDZqHvML6p","title":"Tweets From Kaavyya","author":"@kaavyya on Twitter","category":"tweets","url":"https://x.com/kaavyya/status/2064749018677404049","text":"Fucking insaneeee https://t.co/XDZqHvML6p","note":"","keywords":["fucking","https","insaneeee","xdzqhvml6p"],"val":2.5},{"id":"1023380853","type":"highlight","label":"folks we got a new ceasefire and that’s why premarkets are green 😂 https://t.co/66nOJMo1...","title":"Tweets From Amit","author":"@amitisinvesting on Twitter","category":"tweets","url":"https://x.com/amitisinvesting/status/2063957359978852845","text":"folks we got a new ceasefire and that’s why premarkets are green 😂 https://t.co/66nOJMo1gt\n\n![](https://pbs.twimg.com/media/HKSmR48WwAAL0cR.jpg)","note":"","keywords":["https","ceasefire","folks","green","hksmr48wwaal0cr","media","nojmo1gt","premarkets"],"val":2.5},{"id":"1021567903","type":"highlight","label":"**Pick your battles.** When it comes to collaboration, don’t waste time bikeshedding. If ...","title":"Fast Is Better Than Slow","author":"About","category":"articles","url":"https://read.readwise.io/read/01kt4c68wnkkcmb577qravvb2s","text":"**Pick your battles.** When it comes to collaboration, don’t waste time bikeshedding. If your PR reviewer wants you to change something, it’s almost always faster to do what they’re asking than to argue about it. 95% of the time, the differences are so minor that it’s barely worth discussing. Save your time and energy for the 5% that matter.","note":"","keywords":["almost","always","argue","asking","barely","battles","bikeshedding","change"],"val":2.5},{"id":"1021566613","type":"highlight","label":"**Don’t worry about looking dumb.** You probably already know that you should share your ...","title":"Fast Is Better Than Slow","author":"About","category":"articles","url":"https://read.readwise.io/read/01kt4c2sr8adpks7njh3xeaz16","text":"**Don’t worry about looking dumb.** You probably already know that you should share your work early and often. But it’s uncomfortable, so it’s easy to put it off while telling yourself a story like “I have a high bar for quality.”\n\nYou’ll get results much faster if you learn to push through that discomfort. Oliver Burkeman talks about [the 70% rule](https://ckarchive.com/b/wvu2hghk5m82zf9r552rqtn34kzxxc8):\n\n> If you’re roughly 70% happy with a piece of writing you’ve produced, you’ll should publish it. If you’re 70% satisfied with a product you’ve created, launch it.\n> \n> […]\n> \n> Moving forward at 70% takes more guts, more strength of character, than holding out for 100%, because it entails moving forward amid uncertainty, anxiety, and the disagreeable feeling that comes with putting less-than-perfect work into the world.\n\nThe same goes for PRs. Don’t waste time polishing your code in hopes that your reviewer will find nothing wrong — push it now and accept the feedback. There are no points for getting your PR approved without comments.","note":"","keywords":["forward","moving","push","accept","already","amid","anxiety","approved"],"val":2.5},{"id":"1021565789","type":"highlight","label":"if you’re fast, you get data more quickly. That helps you make better decisions, sooner. ...","title":"Fast Is Better Than Slow","author":"About","category":"articles","url":"https://read.readwise.io/read/01kt4c0vgs7dz6fwd536944e3z","text":"if you’re fast, you get data more quickly. That helps you make better decisions, sooner. It also means you learn faster, and over longer periods it means you learn *more*. Being fast also means you can try out multiple approaches to a problem and pick the best one.","note":"","keywords":["means","fast","learn","approaches","best","better","data","decisions"],"val":2.5},{"id":"1021565772","type":"highlight","label":"Do only what’s required.","title":"Fast Is Better Than Slow","author":"About","category":"articles","url":"https://read.readwise.io/read/01kt4c087e6qbj3b8bth6yr3d2","text":"Do only what’s required.","note":"","keywords":["required"],"val":2.5},{"id":"1021565771","type":"highlight","label":"If you try to go “above and beyond”, you’re almost always guessing — about what someone e...","title":"Fast Is Better Than Slow","author":"About","category":"articles","url":"https://read.readwise.io/read/01kt4bzmnd7zsg4f1safaqy3gm","text":"If you try to go “above and beyond”, you’re almost always guessing — about what someone else wants, or what the system will require in the future. And the more inexperienced you are, the greater the chance that your guess is wrong.","note":"","keywords":["above","almost","always","beyond","chance","else","future","greater"],"val":2.5},{"id":"1021534818","type":"highlight","label":"The return type *tells you the truth*: here are exactly the shapes you'll get back, and y...","title":"Union Types Are Finally Coming to C#","author":"milan@milanjovanovic.tech (Milan Jovanović)","category":"articles","url":"https://read.readwise.io/read/01kt41fqbeb7pzshhs00v8gbvf","text":"The return type *tells you the truth*: here are exactly the shapes you'll get back, and you can't ignore one by accident. No more reading the method body to discover what it might throw.","note":"","keywords":["accident","back","body","discover","exactly","here","ignore","method"],"val":2.5},{"id":"1021090863","type":"highlight","label":"🧵 The @GitHubCopilot Token Tax is Here. Are You Ready for UBB? Tomorrow, the rules of th...","title":"Tweets From Oren Melamed","author":"@OrenMe on Twitter","category":"tweets","url":"https://x.com/OrenMe/status/2061183373041651727","text":"🧵 The @GitHubCopilot  Token Tax is Here. \nAre You Ready for UBB?\n\nTomorrow, the rules of the game change. @GitHubCopilot  is officially moving from the flat-rate Premium Request Units (PRUs) to Usage-Based Billing (UBB).\n\nHere is a list of unfiltered options for you (and also","note":"","keywords":["githubcopilot","here","billing","change","flat-rate","game","list","moving"],"val":2.5},{"id":"1019704367","type":"highlight","label":"**llm-council** web app.","title":"This Guy Is on Fire With the Skills He’s Making","author":"ℏεsam","category":"tweets","url":"https://read.readwise.io/read/01ksmb0fcag1fjxpg2eve3dhcp","text":"**llm-council** web app.","note":"","keywords":["llm-council"],"val":2.5},{"id":"1019690036","type":"highlight","label":"Human review should move up the stack. It should focus on whether **the feature solves th...","title":"How to Catch AI Mistakes in Your Code","author":"Craft Better Software","category":"articles","url":"https://read.readwise.io/read/01ksm32kx3sdys6d0fr04h1t4p","text":"Human review should move up the stack. It should focus on whether **the feature solves the right problem, whether the business rule is correct, whether the tradeoff makes sense, and whether the design fits the product.**","note":"","keywords":["whether","business","correct","design","feature","fits","focus","human"],"val":2.5},{"id":"1019689946","type":"highlight","label":"Coverage tells you what code ran. Mutation testing tells you whether your tests would cat...","title":"How to Catch AI Mistakes in Your Code","author":"Craft Better Software","category":"articles","url":"https://read.readwise.io/read/01ksm3162vmaz9fywrnjdjr9tb","text":"Coverage tells you what code ran. Mutation testing tells you whether your tests would catch a bug.","note":"","keywords":["tells","catch","coverage","mutation","testing","tests","whether","would"],"val":2.5},{"id":"1019689926","type":"highlight","label":"**Code coverage is not a quality metric.** You can have 100% coverage without any test as...","title":"How to Catch AI Mistakes in Your Code","author":"Craft Better Software","category":"articles","url":"https://read.readwise.io/read/01ksm309frrnt2yagqxspe2x63","text":"**Code coverage is not a quality metric.** You can have 100% coverage without any test assertions. Code coverage can help to detect untested areas of the code, **but it doesn't tell anything about the tested areas**\n\nThe solution is to use mutation testing.","note":"","keywords":["coverage","areas","anything","assertions","detect","doesn","help","metric"],"val":2.5},{"id":"1015388144","type":"highlight","label":"Specs also drastically increase adherence to our architectural and compliance standards c...","title":"Our Design Docs Write Themselves","author":"Shrivu Shankar","category":"articles","url":"https://read.readwise.io/read/01krj3mnx5va4egmtzvfg0g75h","text":"Specs also drastically increase adherence to our architectural and compliance standards compared to just including the .ai-dev files in a coding session. The spec forces every design decision through those constraints before execution begins, rather than hoping the agent references the right file at the right moment.","note":"","keywords":["right","adherence","agent","ai-dev","architectural","begins","coding","compared"],"val":2.5},{"id":"1015388016","type":"highlight","label":"Every design review is a review of a spec output. The feedback from that review feeds bac...","title":"Our Design Docs Write Themselves","author":"Shrivu Shankar","category":"articles","url":"https://read.readwise.io/read/01krj3gf4mcc31q8kz20vjfw6b","text":"Every design review is a review of a spec output. The feedback from that review feeds back into the system files.","note":"","keywords":["review","back","design","feedback","feeds","files","output","spec"],"val":2.5},{"id":"1015388011","type":"highlight","label":"**The Self-Updating Codebase** Keeping markdown files up to date manually is hard, especi...","title":"Our Design Docs Write Themselves","author":"Shrivu Shankar","category":"articles","url":"https://read.readwise.io/read/01krj3fy2xtzhgx3fa7s1w91qz","text":"**The Self-Updating Codebase**\n\nKeeping markdown files up to date manually is hard, especially when updates are tied to PR flows. Engineers attend a design review, raise important concerns, and walk away without updating a single file. The knowledge stays in the meeting recording.\n\nSo we automated it. Every week, an agent processes all recorded design review meetings (every review has our Zoom bot in the call), Slack threads, design docs, and samples of PR review comments, then generates a PR proposing updates to the system files. A human reviews and approves.","note":"","keywords":["review","design","files","updates","agent","approves","attend","automated"],"val":2.5},{"id":"1015345705","type":"highlight","label":"**approach that consistently worked for me is approaching problems from the customer’s pe...","title":"“How to Be a 10x Engineer” – Interview With a Standout Dev","author":"The Pragmatic Engineer","category":"articles","url":"https://read.readwise.io/read/01krhh0kcrhndsj6mbzrd0x33s","text":"**approach that consistently worked for me is approaching problems from the customer’s perspective, and being genuinely curious.** For example, I might ping an engineer working on a different system and ask:\n\n> “I noticed a customer has this problem, and to fix it, we probably need to touch the system you own. I don’t know much about this system: can you explain how it works, and what we could perhaps do to solve this issue that causes frustration for the customer?”\n\nBy making it clear that my goal is to solve a customer problem, I’m not coming across as just digging around for nothing. And by making it clear that I’d like to learn from them, it avoids being seen as someone trying to confirm what they are doing, which could come across as arrogant – especially when the other engineer is the expert on their own system. I’ve found fellow engineers are happy to explain their understanding and decisions.","note":"","keywords":["customer","system","across","clear","engineer","explain","making","problem"],"val":2.5},{"id":"1015345703","type":"highlight","label":"**delays are not an issue as long as they are communicated upfront with an explanation an...","title":"“How to Be a 10x Engineer” – Interview With a Standout Dev","author":"The Pragmatic Engineer","category":"articles","url":"https://read.readwise.io/read/01krhgtsrpnq5pdh3hn6eq6dpq","text":"**delays are not an issue as long as they are communicated upfront with an explanation and potential alternatives.** When we hit a roadblock that slows down our work, I would never communicate that we’re “behind”. I would offer alternatives like:\n\n•   We can still ship on time, but we’d need to cut X and Y features for this release\n•   If we are not comfortable cutting X and Y features, then we will need to push out the target date by 2 weeks. If we are comfortable, we can push it out by 1 week\n\nThe trick, I’ve found, is to make it clear to stakeholders that we have a *choice*: choose more features to ship, or choose a lower-priority feature to drop.","note":"","keywords":["features","alternatives","choose","comfortable","push","ship","would","behind"],"val":2.5},{"id":"1015345702","type":"highlight","label":"Having a high-level breakdown of the work, and communicating to stakeholders has been my ...","title":"“How to Be a 10x Engineer” – Interview With a Standout Dev","author":"The Pragmatic Engineer","category":"articles","url":"https://read.readwise.io/read/01krhgsz67g8q7a5wry0m734gm","text":"Having a high-level breakdown of the work, and communicating to stakeholders has been my “secret”,","note":"","keywords":["breakdown","communicating","having","high-level","secret","stakeholders"],"val":2.5},{"id":"1015345686","type":"highlight","label":"**Personal Pitfalls****You don’t shift left, so you don’t understand what you ship.** AI ...","title":"How AI Productivity Fails","author":"Shrivu Shankar","category":"articles","url":"https://read.readwise.io/read/01krhfbq8akf7p11d9vcjprp51","text":"**Personal Pitfalls****You don’t shift left, so you don’t understand what you ship.**\n\nAI removes the friction that used to force planning. Without something pushing back on bad abstractions, the upfront thinking gets skipped silently. You ship systems you can’t debug or extend, full of blanks AI quietly filled in. Outline first: headers, structure, audience, plan, principles, what-done-looks-like, then let AI fill it in. Review shifts up the stack: outcome-vs-plan instead of line-by-line. The interrogation belongs *inside* planning: spawn subagent critics to red-team the plan before you let anything generate against it. The easy review at the end is only easy because the hard review at the start was good. If you find it taxing to review your own AI generated output, [you didn’t shift left](https://substack.com/redirect/c5de8b48-d334-4c55-a4c7-dab2f4fd6088?j=eyJ1IjoiNDRoZ3BuIn0.PPCfW0pHm93lKhlN9sIfzDxVBP-sIUbDZKABTHCkW5s).","note":"","keywords":["review","easy","left","plan","planning","shift","ship","abstractions"],"val":2.5},{"id":"1013984374","type":"highlight","label":"Whenever I investigate a bug, I let codex recreate the exact state in an emphemeral crabb...","title":"Tweets From Peter Steinberger","author":"@steipete on Twitter","category":"tweets","url":"https://x.com/steipete/status/2053032450138276274","text":"Whenever I investigate a bug, I let codex recreate the exact state in an emphemeral crabbox, verify the bug, fix it, verify the fix.\n\nNo messy state because local system might be polluted, and no slowdown because I run 10 sessions in parallel. https://t.co/SEj2XRpaD1 https://t.co/PiBG8YBdRM\n\n![](https://pbs.twimg.com/media/HH3V5jEXkAAcAx3.jpg)","note":"","keywords":["https","state","verify","codex","crabbox","emphemeral","exact","hh3v5jexkaacax3"],"val":2.5},{"id":"1012713283","type":"highlight","label":"As an AI Engineer. Please learn: -Prompt caching & semantic caching tradeoffs -KV cache m...","title":"Tweets From Puneet Patwari","author":"@system_monarch on Twitter","category":"tweets","url":"https://x.com/system_monarch/status/2051662489616794035","text":"As an AI Engineer. Please learn:\n\n-Prompt caching & semantic caching tradeoffs  \n-KV cache management at scale  \n-Speculative decoding vs quantization  \n-RAG evaluation (RAGAS + human evals)  \n-Cost monitoring & hidden token leaks  \n-Agent guardrails & infinite loop detection","note":"","keywords":["caching","agent","cache","cost","decoding","detection","engineer","evals"],"val":2.5},{"id":"1011963974","type":"highlight","label":"Two Anthropic engineers spent 24 minutes exposing every Claude Code feature you didn't kn...","title":"Tweets From Rahul","author":"@sairahul1 on Twitter","category":"tweets","url":"https://x.com/sairahul1/status/2049390786027167985","text":"Two Anthropic engineers spent 24 minutes exposing every Claude Code feature you didn't know existed. \n\nMost people will scroll past this. Don't be most people. https://t.co/x62ejMXIJi","note":"","keywords":["anthropic","claude","didn","engineers","existed","exposing","feature","https"],"val":2.5},{"id":"1011963972","type":"highlight","label":"Tous les utilisateurs Claude après avoir lu cet article https://t.co/tpoXTjAV9L https://t...","title":"Tweets From Wizness ☁️","author":"@wiznesspro on Twitter","category":"tweets","url":"https://x.com/wiznesspro/status/2050232963757969444","text":"Tous les utilisateurs Claude après avoir lu cet article https://t.co/tpoXTjAV9L https://t.co/YV8P90Yuj1","note":"","keywords":["https","article","avoir","claude","tous","tpoxtjav9l","utilisateurs","yv8p90yuj1"],"val":2.5},{"id":"1011913952","type":"highlight","label":"Rewind is often the better approach to correction. For example, Claude reads five files, ...","title":"Using Claude Code: Sessio ically","block","calls","dispose","finished","object"],"val":2.5},{"id":"988603890","type":"highlight","label":"your class **owns** a class that implements `IDisposable`, it **must** [cascade dispose c...","title":"Mastering the C# Dispose Pattern","author":"Ivan Kahl's Blog","category":"articles","url":"https://read.readwise.io/read/01khk1bv025cyyv0ehdsfty165","text":"your class **owns** a class that implements `IDisposable`, it **must** [cascade dispose calls](https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose?ref=blog.ivankahl.com#cascade-dispose-calls) down to those owned objects to ensure proper cleanup.\n\nHowever, this is **not necessary** if your class **doesn't own** the resource (e.g., it was passed in as a dependency in the constructor).","note":"","keywords":["class","blog","calls","cascade","cascade-dispose-calls","cleanup","constructor","dependency"],"val":2.5},{"id":"988603826","type":"highlight","label":"The `_disposed` field also keeps track of whether the dispose method has been called alre...","title":"Mastering the C# Dispose Pattern","author":"Ivan Kahl's Blog","category":"articles","url":"https://read.readwise.io/read/01khk1aerw9z1tg6bj5kfea8ge","text":"The `_disposed` field also keeps track of whether the dispose method has been called already. This is important, since your `Dispose()` method [*should* *always be idempotent*](https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/implementing-dispose?ref=blog.ivankahl.com#implement-the-dispose-pattern-for-a-derived-class)","note":"","keywords":["dispose","method","already","always","blog","called","disposed","dotnet"],"val":2.5},{"id":"988603584","type":"highlight","label":"there are scenarios where you, as the developer, need to manually clean up unmanaged reso...","title":"Mastering the C# Dispose Pattern","author":"Ivan Kahl's Blog","category":"articles","url":"https://read.readwise.io/read/01khk15gm3qw3m1ahvkee4f9vm","text":"there are sc  sped up dealing with bug reports.It’s similar to Claude Code’s skills feature","note":"","keywords":["claude","dealing","feature","greatly","processor","report","reports","similar"],"val":2.5},{"id":"982068213","type":"highlight","label":"A few random notes from claude coding quite a bit last few weeks. Coding workflow. Given ...","title":"Tweets From Andrej Karpathy","author":"@karpathy on Twitter","category":"tweets","url":"https://twitter.com/karpathy/status/2015883857489522876","text":"A few random notes from claude coding quite a bit last few weeks.\n\nCoding workflow. Given the latest lift in LLM coding capability, like many others I rapidly went from about 80% manual+autocomplete coding and 20% agents in November to 80% agent coding and 20% edits+touchups in","note":"","keywords":["coding","agent","agents","autocomplete","capability","claude","edits","given"],"val":2.5},{"id":"981658161","type":"highlight","label":"slash commands (which are prompt templates you invoke explicitly)","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvdcy94kvb9pc8eyr5xe7a6","text":"slash commands (which are prompt templates you invoke explicitly)","note":"","keywords":["commands","explicitly","invoke","prompt","slash","templates"],"val":2.5},{"id":"981656861","type":"highlight","label":"Bash commands Claude can’t guess","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcxmwkvmdqbvwwnr6zratx","text":"Bash commands Claude can’t guess","note":"","keywords":["bash","claude","commands","guess"],"val":2.5},{"id":"981656858","type":"highlight","label":"Code style rules that differ from defaults","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcxjzcd6yzvvabkexqygwy","text":"Code style rules that differ from defaults","note":"","keywords":["d ,"val":2.5},{"id":"981656800","type":"highlight","label":"For each line, ask: *“Would removing this cause Claude to make mistakes?”* If not, cut it...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcw2fgp1xz2ptj5ncjn4g8","text":"For each line, ask: *“Would removing this cause Claude to make mistakes?”* If not, cut it. Bloated CLAUDE.md files cause Claude to ignore your actual instructions!","note":"","keywords":["claude","cause","actual","bloated","files","ignore","instructions","line"],"val":2.5},{"id":"981656729","type":"highlight","label":"four phases","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvctb77awk2p9mh0wbwrhj5","text":"four phases","note":"Explore, Plan, Execution, and commit. ","keywords":["commit","execution","explore","four","phases","plan"],"val":2.5},{"id":"981656582","type":"highlight","label":"Use [Plan Mode](https://code.claude.com/docs/en/common-workflows#use-plan-mode-for-safe-c...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcnwh2d37h956ft82ke5gv","text":"Use [Plan Mode](https://code.claude.com/docs/en/common-workflows#use-plan-mode-for-safe-code-analysis) to separate exploration from execution.","note":"","keywords":["claude","common-workflows","docs","execution","exploration","https","mode","plan"],"val":2.5},{"id":"981656551","type":"highlight","label":"Strategy","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcndky6p8eyasgn6z71m3c","text":"Strategy","note":"","keywords":["strategy"],"val":2.5},{"id":"981656548","type":"highlight","label":"Provide verification criteria","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcnap2g7r7genx3w63mvr5","text":"Provide verification criteria","note":"","keywords":["criteria","provide","verification"],"val":2.5},{"id":"981656435","type":"highlight","label":"Address root causes, not symptoms","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvckwqjr97fasyz5kcfw0xb","text":"Address root causes, not symptoms","note":"","keywords":["address","causes","root","symptoms"],"val":2.5},{"id":"981656082","type":"highlight","label":"context window is the most important resource to manage.","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcj6de5tfsevkttydbx6d8","text":"context window is the most important resource to manage.","note":"","keywords":["context","important","manage","resource","window"],"val":2.5},{"id":"981656030","type":"highlight","label":"LLM performance degrades as context fills. When the context window is getting full, Claud...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfvcgtnmq73n1sregxge0ma2","text":"LLM performance degrades as context fills. When the context window is getting full, Claude may start “forgetting” earlier instructions or making more mistakes.","note":"","keywords":["context","claude","degrades","earlier","fills","forgetting","full","getting"],"val":2.5},{"id":"981597669","type":"highlight","label":"Use `/rename` to give sessions descriptive names (`\"oauth-migration\"`, `\"debugging-memory...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kftzrd1n5249kk7d5n30etn8","text":"Use `/rename` to give sessions descriptive names (`\"oauth-migration\"`, `\"debugging-memory-leak\"`) so you can find them later","note":"","keywords":["debugging-memory-leak","descriptive","find","give","later","names","oauth-migration","rename"],"val":2.5},{"id":"981593158","type":"highlight","label":"**The infinite exploration.** You ask Claude to “investigate” something without scoping i...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kftyg1wrdffkznx88c2n6naj","text":"**The infinite exploration.** You ask Claude to “investigate” something without scoping it. Claude reads hundreds of files, filling the context.\n\n> **Fix**: Scope investigations narrowly or use subagents so the exploration doesn’t consume your main context.","note":"","keywords":["claude","context","exploration","consume","doesn","files","filling","hundreds"],"val":2.5},{"id":"981593142","type":"highlight","label":"**trust-then-verify gap.** Claude produces a plausible-looking implementation that doesn’...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kftyfq6fxz6rmdpgt6r9dmsp","text":"**trust-then-verify gap.** Claude produces a plausible-looking implementation that doesn’t handle edge cases.\n\n> **Fix**: Always provide verification (tests, scripts, screenshots). If you can’t verify it, don’t ship it.","note":"","keywords":["always","cases","claude","doesn","edge","handle","implementation","plausible-looking"],"val":2.5},{"id":"981592532","type":"highlight","label":"• You start with one task, then ask Claude something unrelated, then go back to the first...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kftybwcvmbp63qa8prhz3jsx","text":"•   You start with one task, then ask Claude something unrelated, then go back to the first task. Context is full of irrelevant information.\n    \n    > **Fix**: `/clear` between unrelated tasks.\n    \n•   **Correcting over and over.** Claude does something wrong, you correct it, it’s still wrong, you correct again. Context is polluted with failed approaches.\n    \n    > **Fix**: After two failed corrections, `/clear` and write a better initial prompt incorporating what you learned.","note":"","keywords":["claude","clear","context","correct","failed","something","task","unrelated"],"val":2.5},{"id":"981591760","type":"highlight","label":"have one Claude write tests, then another write code to pass them","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfty9n2gc8te2mce2ccb7eja","text":"have one Claude write tests, then another write code to pass them","note":"","keywords":["write","another","claude","pass","tests"],"val":2.5},{"id":"981591741","type":"highlight","label":"multiple sessions enable quality-focused workflows. A fresh context improves code review ...","title":"Best Practices for Claude Code","author":"Claude Code Docs","category":"articles","url":"https://read.readwise.io/read/01kfty9b3tm2b9ed1p3tyjdtbs","text":"multiple sessions enable quality-focused workflows. A fresh context improves code review since Claude won’t be biased toward code it just wrote. For example, use a Writer/Reviewer pattern","note":"","keywords":["biased","claude","context","enable","example","fresh","improves","multiple"],"val":2.5}],"links":[{"source":"source:61344517","target":"1025533340","type":"source","label":"source","value":1},{"source":"source:61343102","target":"1025514836","type":"source","label":"source","value":1},{"source":"source:61343102","target":"1025514818","type":"source","label":"source","value":1},{"source":"source:61343102","target":"1025514804","type":"source","label":"source","value":1},{"source":"source:59946032","target":"1025315832","type":"source","label":"source","value":1},{"source":"source:61325875","target":"1025277262","type":"source","label":"source","value":1},{"source":"source:61310906","target":"1025133421","type":"source","label":"source","value":1},{"source":"source:61310888","target const details=document.getElementById('details');
const graph=ForceGraph()(document.getElementById('graph'))
  .graphData(data)
  .backgroundColor('#111014')
  .nodeRelSize(5)
  .nodeVal(node=>node.val)
  .nodeLabel(node=>node.type==='source'?node.label:node.text)
  .nodeColor(node=>node.type==='source'?'#f6c177':'#c4a7e7')
  .linkColor(link=>link.type==='idea'?'rgba(235,111,146,.68)':'rgba(196,167,231,.18)')
  .linkWidth(link=>link.type==='idea'?Math.max(1,link.value):.7)
  .linkDirectionalParticles(link=>link.type==='idea'?2:0)
  .linkDirectionalParticleSpeed(.004)
  .onNodeClick(node=>{
    if(node.type==='source'){
      const children=data.nodes.filter(candidate=>candidate.type==='highlight'&&candidate.title===node.label);
      details.innerHTML='<div class="item"><strong>'+escapeHtml(node.label)+'</strong><p>'+escapeHtml(node.author||'Unknown')+' · '+children.length+' highlights</p></div>'+children.slice(0,8).map(renderHighlight).join('');
      graph.centerAt(node.x,node.y,700); graph.zoom(3,700); return;
    }
    details.innerHTML=renderHighlight(node,true);
    graph.centerAt(node.x,node.y,700); graph.zoom(5,700);
  });

function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function renderHighlight(node,full=false){
  const text=full?node.text:(node.text||'').slice(0,220);
  const tags=(node.keywords||[]).slice(0,6).map(tag=>'<span class="pill">'+escapeHtml(tag)+'</span>').join('');
  return '<div class="item"><strong>'+escapeHtml(node.title||'Highlight')+'</strong><p>'+escapeHtml(node.author||'Unknown')+'</p><p>'+escapeHtml(text)+'</p><div>'+tags+'</div></div>';
}
window.addEventListener('resize',()=>graph.width(document.getElementById('graph').clientWidth).height(document.getElementById('graph').clientHeight));
