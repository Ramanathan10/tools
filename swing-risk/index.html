<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swing Risk Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: #10151b;
      --panel-2: #151b22;
      --line: #2b3540;
      --text: #f2f7fb;
      --muted: #95a3b3;
      --green: #00e887;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #07120f 0%, var(--bg) 45%, #0b1016 100%);
      color: var(--text);
      letter-spacing: 0;
    }

    main {
      width: min(560px, calc(100% - 28px));
      margin: 0 auto;
      padding: 30px 0;
    }

    header {
      margin-bottom: 18px;
    }

    .eyebrow,
    label,
    .stat-label,
    button {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .eyebrow {
      color: var(--green);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 0;
      font-size: clamp(2.25rem, 7vw, 5.3rem);
      line-height: 0.95;
    }

    .workspace {
      display: grid;
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(16, 21, 27, 0.92);
    }

    .inputs {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #090d12;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
      font-size: 1rem;
      letter-spacing: 0;
      outline: none;
    }

    input:focus {
      border-color: color-mix(in srgb, var(--green), var(--line) 35%);
      box-shadow: 0 0 0 3px rgba(0, 232, 135, 0.1);
    }

    .field-action {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .market-actions {
      display: grid;
      gap: 8px;
    }

    .range-field {
      display: grid;
      gap: 9px;
    }

    .range-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .range-value {
      color: var(--green);
      white-space: nowrap;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--green);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button.mini {
      min-width: 82px;
      padding: 11px 10px;
      white-space: nowrap;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--green);
      outline: none;
    }

    .note-actions {
      padding: 14px 16px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .note-preview {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .summary {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .stat {
      min-height: 110px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 18px;
      font-size: clamp(1.55rem, 3.2vw, 2.4rem);
      line-height: 1;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .green { color: var(--green); }
    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      main { width: min(100% - 18px, 560px); padding: 18px 0; }
      .row,
      .field-action,
      .summary {
        grid-template-columns: 1fr;
      }

      button.mini {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Trade Prep</div>
        <h1>Swing Risk Calculator</h1>
      </div>
    </header>

    <section class="workspace">
      <form class="panel inputs" id="trade-form" autocomplete="off">
        <div class="market-actions">
          <div class="field-action">
            <label>
              Ticker
              <input id="ticker" value="AAPL" autocomplete="off" />
            </label>
            <button class="mini" type="button" id="refreshMarket">Refresh</button>
          </div>
        </div>

        <div class="range-field">
          <div class="range-head">
            <span>Max Loss</span>
            <span class="range-value" id="maxLossValue">$400</span>
          </div>
          <input id="maxLoss" type="range" min="50" max="2000" step="25" value="400" autocomplete="off" />
        </div>

        <div class="row">
          <label>
            Entry
            <input id="entry" inputmode="decimal" value="185.50" />
          </label>
          <label>
            Stop
            <input id="stop" inputmode="decimal" value="179.80" />
          </label>
        </div>

        <label>
          Target
          <input id="target" inputmode="decimal" value="202.60" readonly />
        </label>
      </form>

      <section class="panel summary">
        <div class="stat">
          <span class="stat-label">Position</span>
          <span class="stat-value green" id="shares">0 sh</span>
        </div>
        <div class="stat">
          <span class="stat-label">Equity</span>
          <span class="stat-value green" id="equity">$0</span>
        </div>
      </section>

      <section class="panel note-actions" aria-label="Trade note export">
        <span class="note-preview" id="notePreview">Plan ready for trading notes.</span>
        <button type="button" id="copyPlan">Copy Plan</button>
      </section>
    </section>
  </main>

  <script>
    const ALPHA_VANTAGE_API_KEY = "E9EC2NZ5JYED10VK";
    const TARGET_R = 3;
    const DEFAULT_MAX_LOSS = 400;
    const ids = ["ticker", "maxLoss", "entry", "stop", "target"];
    const fields = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]));
    const output = {
      maxLossValue: document.getElementById("maxLossValue"),
      shares: document.getElementById("shares"),
      equity: document.getElementById("equity"),
      notePreview: document.getElementById("notePreview"),
    };
    const refreshMarket = document.getElementById("refreshMarket");
    const copyPlan = document.getElementById("copyPlan");
    let latestPlan = {};

    function numberValue(field) {
      return Number.parseFloat(String(field.value).replace(/[$,%\s]/g, ""));
    }

    function getMaxLoss() {
      return Number.isFinite(fields.maxLoss.valueAsNumber)
        ? fields.maxLoss.valueAsNumber
        : DEFAULT_MAX_LOSS;
    }

    function money(value) {
      if (!Number.isFinite(value)) return "$0";
      return value.toLocaleString(undefined, {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: Math.abs(value) >= 100 ? 0 : 2,
      });
    }

    function price(value) {
      return Number.isFinite(value) ? value.toFixed(2) : "";
    }

    function setRefreshStatus(message, state = "") {
      refreshMarket.title = message;
      if (state === "bad") {
        refreshMarket.textContent = "Error";
        setTimeout(() => { refreshMarket.textContent = "Refresh"; }, 1200);
      }
    }

    function setMarketLoading(isLoading) {
      refreshMarket.disabled = isLoading;
      if (isLoading) {
        refreshMarket.textContent = "Loading";
      } else if (refreshMarket.textContent === "Loading") {
        refreshMarket.textContent = "Refresh";
      }
    }

    function getTicker() {
      return fields.ticker.value.trim().toUpperCase().replace(/\s+/g, "");
    }

    function buildTradePlan(plan) {
      const today = new Date().toLocaleDateString(undefined, {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      });

      return [
        `## ${plan.ticker || "TICKER"} Swing Plan - ${today}`,
        "",
        `- Entry: ${money(plan.entry)}`,
        `- Stop: ${money(plan.stop)}`,
        `- Target: ${money(plan.target)} (${TARGET_R}R)`,
        `- Risk/share: ${money(plan.riskPerShare)}`,
        `- Max loss: ${money(plan.maxLoss)}`,
        `- Position: ${plan.shares.toLocaleString()} shares`,
        `- Buying power: ${money(plan.equity)}`,
        `- Reward: ${money(plan.reward)}`,
      ].join("\n");
    }

    async function copyTradePlan() {
      if (!latestPlan.shares) {
        output.notePreview.textContent = "Enter a valid entry and stop first.";
        return;
      }

      const planText = buildTradePlan(latestPlan);
      try {
        await navigator.clipboard.writeText(planText);
        copyPlan.textContent = "Copied";
        output.notePreview.textContent = `${latestPlan.ticker || "Trade"} plan copied for notes.`;
        setTimeout(() => { copyPlan.textContent = "Copy Plan"; }, 1200);
      } catch {
        output.notePreview.textContent = planText;
      }
    }

    function getAlphaVantageKey() {
      return ALPHA_VANTAGE_API_KEY;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    async function fetchMarketSnapshot(symbol) {
      const apiKey = getAlphaVantageKey();
      if (!apiKey) {
        throw new Error("Alpha Vantage API key required");
      }

      const encoded = encodeURIComponent(symbol);
      const query = `symbol=${encoded}&apikey=${encodeURIComponent(apiKey)}`;
      const quote = await fetchJson(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&${query}`);

      if (quote.Note || quote.Information) {
        throw new Error("Alpha Vantage rate limit hit");
      }
      if (quote["Error Message"]) {
        throw new Error("Symbol not found");
      }

      const globalQuote = quote["Global Quote"] || {};
      const current = Number(globalQuote["05. price"]);
      const dayLow = Number(globalQuote["04. low"]);
      const latestDate = globalQuote["07. latest trading day"];

      if (!Number.isFinite(current)) {
        throw new Error("Current price unavailable");
      }
      if (!Number.isFinite(dayLow)) {
        throw new Error("Day low unavailable");
      }

      return {
        current,
        dayLow,
        latestDate,
      };
    }

    async function refreshMarketValues() {
      const symbol = getTicker();
      if (!symbol) {
        setRefreshStatus("Enter a ticker first.", "bad");
        fields.ticker.focus();
        return;
      }

      setMarketLoading(true);
      setRefreshStatus(`Refreshing ${symbol} from Alpha Vantage...`);
      try {
        const snapshot = await fetchMarketSnapshot(symbol);
        const stopOffset = snapshot.current < 100 ? 0.5 : 1;
        const stop = snapshot.dayLow - stopOffset;
        const target = snapshot.current + (TARGET_R * (snapshot.current - stop));

        fields.entry.value = price(snapshot.current);
        fields.stop.value = price(stop);
        fields.target.value = price(target);

        calculate();
        const stopWarning = stop >= snapshot.current
          ? " Stop is above entry; adjust stop for long sizing."
          : "";
        setRefreshStatus(
          `${symbol}: current ${money(snapshot.current)}, day low ${money(snapshot.dayLow)}, stop ${money(stop)} (${money(stopOffset)} below low), target ${money(target)}. ${snapshot.latestDate}.${stopWarning}`,
          stop >= snapshot.current ? "bad" : "good"
        );
      } catch (error) {
        setRefreshStatus(`Could not fetch ${symbol}: ${error.message}.`, "bad");
      } finally {
        setMarketLoading(false);
      }
    }

    function calculate() {
      const maxLoss = getMaxLoss();
      const entry = numberValue(fields.entry);
      const stop = numberValue(fields.stop);

      const riskPerShare = entry - stop;
      const target = riskPerShare > 0 ? entry + (TARGET_R * riskPerShare) : entry;
      const shares = Number.isFinite(riskPerShare) && riskPerShare > 0
        ? Math.max(0, Math.floor(maxLoss / riskPerShare))
        : 0;
      const equity = shares * entry;
      const reward = shares * (target - entry);

      if (Number.isFinite(target) && fields.target.value !== price(target)) {
        fields.target.value = price(target);
      }
      output.maxLossValue.textContent = money(maxLoss);
      output.shares.textContent = `${shares.toLocaleString()} sh`;
      output.equity.textContent = money(equity);
      latestPlan = {
        ticker: getTicker(),
        maxLoss,
        entry,
        stop,
        target,
        riskPerShare,
        shares,
        equity,
        reward,
      };
      output.notePreview.textContent = shares > 0
        ? `${getTicker() || "Trade"}: ${shares.toLocaleString()} sh, ${money(maxLoss)} max loss, ${TARGET_R}R target.`
        : "Enter a valid entry above stop.";
    }

    function resetMaxLossToDefault() {
      fields.maxLoss.value = String(DEFAULT_MAX_LOSS);
      calculate();
    }

    ids.forEach((id) => {
      fields[id].addEventListener("input", calculate);
      fields[id].addEventListener("change", calculate);
    });
    refreshMarket.addEventListener("click", refreshMarketValues);
    copyPlan.addEventListener("click", copyTradePlan);
    window.addEventListener("pageshow", resetMaxLossToDefault);

    resetMaxLossToDefault();
  </script>
</body>
</html>
