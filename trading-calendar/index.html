<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Calendar Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #060b0f; --panel: rgba(13, 24, 31, 0.84); --line: rgba(44, 246, 155, 0.18); --line-strong: rgba(44, 246, 155, 0.36); --text: #f4fff9; --muted: rgba(231, 247, 241, 0.58); --green: #00e887; --red: #ff5f6f; --radius: 8px; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 15%, rgba(0, 232, 135, 0.18), transparent 34%), linear-gradient(115deg, #082117 0%, #071016 46%, #04090f 100%); color: var(--text); font-family: Inter, system-ui, sans-serif; letter-spacing: 0; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px); background-size: 84px 84px; mask-image: linear-gradient(to bottom, black, rgba(0, 0, 0, 0.22)); }
    main { width: min(920px, calc(100% - 34px)); margin: 0 auto; padding: 44px 0; position: relative; }
    .eyebrow, .label, .meta { font-family: "JetBrains Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.18em; font-weight: 800; }
    .eyebrow { display: flex; align-items: center; gap: 14px; font-size: 0.86rem; margin-bottom: 34px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 18px var(--green); flex: 0 0 auto; }
    h1 { margin: 0 0 30px; font-size: clamp(3.2rem, 9vw, 6.2rem); line-height: 0.92; font-weight: 900; }
    .months { display: grid; gap: 14px; }
    .month { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; min-height: 112px; padding: 22px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: inherit; text-decoration: none; box-shadow: 0 18px 70px rgba(0, 0, 0, 0.42); }
    .month:hover, .month:focus-visible { outline: none; border-color: var(--line-strong); transform: translateY(-1px); }
    .month strong { display: block; margin-top: 8px; font-size: clamp(1.85rem, 5vw, 3rem); line-height: 1; font-weight: 900; }
    .pnl { font-family: "JetBrains Mono", monospace; color: var(--green); font-size: clamp(1.5rem, 4vw, 2.6rem); font-weight: 900; text-align: right; white-space: nowrap; }
    .pnl.loss { color: var(--red); }
    .meta { margin-top: 9px; font-size: 0.74rem; line-height: 1.7; }
    @media (max-width: 620px) { main { width: min(100% - 22px, 920px); padding-top: 28px; } .month { grid-template-columns: 1fr; } .pnl { text-align: left; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span>Trading Calendar Archive</div>
    <h1>Monthly Trading Calendar</h1>
    <section class="months" aria-label="Archived months">
      <a class="month" href="./2026-06.html">
        <span>
          <span class="label">Current Month</span>
          <strong>June 2026</strong>
          <span class="meta">6 active days | 96 executions | updated 2026-06-09 09:06</span>
        </span>
        <span class="pnl loss">-$1.37K</span>
      </a>
      <a class="month" href="./2026-05.html">
        <span>
          <span class="label">Archive</span>
          <strong>May 2026</strong>
          <span class="meta">21 active days | 275 executions | updated 2026-06-01 09:18</span>
        </span>
        <span class="pnl">+$5.78K</span>
      </a>
    </section>
  </main>
</body>
</html>
